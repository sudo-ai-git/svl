[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svl"
version = "0.2.0"
description = "SVL — Self-Verifying Language: compile to WASM with a 3-layer verification gate (syntax, types, theorem)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "SVL Authors", email = "svl-dev@example.com" }]
license = { text = "MIT" }
keywords = ["svl", "wasm", "verification", "compiler", "formal-methods", "bpsw", "monodromy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Verification",
]

[project.scripts]
svlc = "svl.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
]
smt = [
    "z3-solver",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
svl = ["*.svl", "*.wat", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "Q", "S", "W"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
