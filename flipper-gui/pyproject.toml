[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flipper-gui"
version = "0.1.0"
description = "Modular desktop GUI for communicating with a Flipper Zero."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "bleak>=0.20.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
flipper-gui = "flipper_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flipper_gui*"]

[tool.pytest.ini_options]
testpaths = ["flipper_gui/tests"]
